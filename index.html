/* ================= 本地存储（点击频率 + 最近访问） ================= */
const FREQ_KEY = "nav_freq_v1";
const RECENT_KEY = "nav_recent_v1";
const MAX_RECENT = 8;

let freq = {};
let recent = [];
try {
  const v = JSON.parse(localStorage.getItem(FREQ_KEY) || "{}");
  if (v && typeof v === "object") freq = v;
} catch (e) { freq = {}; }
try {
  const v = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
  if (Array.isArray(v)) recent = v.slice(0, MAX_RECENT);
} catch (e) { recent = []; }

const persist = (key, value) => {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
};
const getFreq = url => freq[url] || 0;

/* ================= 工具函数 ================= */
const el = (tag, cls) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  return node;
};
const domainOf = url => {
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) {
    return String(url).replace(/^https?:\/\//, "").split("/")[0];
  }
};
const escHTML = s => String(s).replace(/[&<>"']/g, m => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[m]));

/* ================= 渲染：卡片 ================= */
function makeCard(item) {
  const domain = domainOf(item.u);
  const a = el("a", "card");
  a.href = item.u;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.title = `${item.n} · ${domain}`;
  a.dataset.u = item.u;
  a.dataset.n = item.n;
  a.dataset.e = item.e;

  const badge = el("span", "freq-badge");
  badge.textContent = "⭐";

  const icon = el("div", "icon");
  const emoji = el("span", "emoji");
  emoji.textContent = item.e;

  const img = new Image();
  img.loading = "lazy";
  img.decoding = "async";
  img.referrerPolicy = "no-referrer";
  img.alt = "";
  img.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
  // 依次降级：Google favicon → DuckDuckGo → 只留 emoji
  img.addEventListener("error", () => {
    if (img.dataset.fallback === "ddg") { img.remove(); return; }
    img.dataset.fallback = "ddg";
    img.src = `https://icons.duckduckgo.com/ip3/${domain}.ico`;
  });

  icon.append(emoji, img);

  const name = el("div", "name");
  name.textContent = item.n;

  a.append(badge, icon, name);
  return { a, name, n: item.n, u: item.u, domain };
}

/* ================= 渲染：全部分区（一次性插入，减少重排） ================= */
const app = document.getElementById("app");
const groupEls = [];
let total = 0;

const rootFrag = document.createDocumentFragment();

data.forEach(group => {
  const count = group.subs.reduce((sum, s) => sum + s.items.length, 0);
  total += count;

  const panel = el("div", "panel");

  const h2 = el("h2", "section");
  const emoji = el("span", "emoji");
  emoji.textContent = group.emoji;
  const cnt = el("span", "count");
  cnt.textContent = count;
  h2.append(emoji, document.createTextNode(group.section + " "), cnt);
  panel.appendChild(h2);

  if (group.desc) {
    const p = el("p", "section-desc");
    p.textContent = group.desc;
    panel.appendChild(p);
  }

  const grids = [];
  group.subs.forEach(s => {
    if (s.sub) {
      const h3 = el("h3", "sub");
      h3.textContent = s.sub;
      panel.appendChild(h3);
    }
    const grid = el("div", "grid");
    const cards = [];
    s.items.forEach(it => {
      const card = makeCard(it);
      cards.push(card);
      grid.appendChild(card.a);
    });
    panel.appendChild(grid);
    grids.push({ grid, cards });
  });

  rootFrag.appendChild(panel);
  groupEls.push({ panel, grids });
});

app.appendChild(rootFrag);

document.getElementById("total").textContent = total;
document.getElementById("groupCount").textContent = data.length;

/* ================= 最近访问 ================= */
const recentWrap = document.getElementById("recentWrap");
const recentGrid = document.getElementById("recentGrid");
const recentCount = document.getElementById("recentCount");

function renderRecent() {
  recentGrid.textContent = "";
  if (!recent.length) {
    recentWrap.style.display = "none";
    return;
  }
  recentWrap.style.display = "";
  recentCount.textContent = recent.length;
  const frag = document.createDocumentFragment();
  recent.forEach(r => frag.appendChild(makeCard(r).a));
  recentGrid.appendChild(frag);
}
renderRecent();

/* ================= 常用置顶 ================= */
const pinToggle = document.getElementById("pinToggle");
function applyPin() {
  groupEls.forEach(g => g.grids.forEach(gr => {
    if (pinToggle.checked) {
      const frag = document.createDocumentFragment();
      gr.cards
        .slice()
        .sort((x, y) => getFreq(y.u) - getFreq(x.u))
        .forEach(c => frag.appendChild(c.a));
      gr.grid.appendChild(frag);
    }
    gr.cards.forEach(c => {
      c.a.classList.toggle("pinned", pinToggle.checked && getFreq(c.u) > 0);
    });
  }));
}
pinToggle.addEventListener("change", applyPin);
applyPin();

/* ================= 点击记录（事件委托，替代 200+ 个监听器） ================= */
function recordClick(url, name, emoji) {
  freq[url] = getFreq(url) + 1;
  persist(FREQ_KEY, freq);

  recent = recent.filter(r => r.u !== url);
  recent.unshift({ n: name, u: url, e: emoji });
  if (recent.length > MAX_RECENT) recent.length = MAX_RECENT;
  persist(RECENT_KEY, recent);

  renderRecent();
  if (pinToggle.checked) applyPin();
}

function handleClick(e) {
  const a = e.target.closest("a.card");
  if (!a || !a.dataset.u) return;
  recordClick(a.dataset.u, a.dataset.n, a.dataset.e);
}
app.addEventListener("click", handleClick);
recentGrid.addEventListener("click", handleClick);

/* ================= 搜索：关键词过滤 + 命中高亮 ================= */
const searchInput = document.getElementById("search");
const emptyBox = document.getElementById("empty");

function setName(card, query) {
  const text = card.n;
  if (!query) {
    card.name.textContent = text;
    return;
  }
  const i = text.toLowerCase().indexOf(query);
  if (i === -1) {
    card.name.textContent = text;
    return;
  }
  card.name.innerHTML =
    escHTML(text.slice(0, i)) +
    "<mark>" + escHTML(text.slice(i, i + query.length)) + "</mark>" +
    escHTML(text.slice(i + query.length));
}

function applySearch() {
  const q = searchInput.value.trim().toLowerCase();
  let anyVisible = false;

  if (q) recentWrap.style.display = "none";

  groupEls.forEach(g => {
    let panelVisible = false;
    g.grids.forEach(gr => {
      let gridVisible = false;
      gr.cards.forEach(c => {
        const hit = !q || c.n.toLowerCase().includes(q) || c.domain.includes(q);
        c.a.style.display = hit ? "" : "none";
        setName(c, q);
        if (hit) { gridVisible = true; panelVisible = true; anyVisible = true; }
      });
      gr.grid.style.display = gridVisible ? "" : "none";
    });
    g.panel.style.display = panelVisible ? "" : "none";

    // 小标题跟随所属网格的可见性
    g.panel.querySelectorAll("h3.sub").forEach(h3 => {
      let visible = false;
      let node = h3.nextElementSibling;
      while (node && !(node.tagName === "H3" && node.classList.contains("sub"))) {
        if (node.classList.contains("grid") && node.style.display !== "none" &&
            Array.from(node.children).some(c => c.style.display !== "none")) {
          visible = true;
          break;
        }
        node = node.nextElementSibling;
      }
      h3.style.display = visible ? "" : "none";
    });
  });

  emptyBox.style.display = anyVisible ? "none" : "block";
  if (!q && recent.length) recentWrap.style.display = "";
}

searchInput.addEventListener("input", applySearch);

/* ================= 键盘快捷键：/ 聚焦，Esc 清空 ================= */
document.addEventListener("keydown", e => {
  const typing = document.activeElement === searchInput;
  if (e.key === "/" && !typing) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  } else if (e.key === "Escape" && typing) {
    searchInput.value = "";
    applySearch();
    searchInput.blur();
  }
});
</script>
