        { n:"抖音", u:"https://www.douyin.com", e:"🎶" },
        { n:"Bilibili", u:"https://www.bilibili.com", e:"📺" },
        { n:"小红书", u:"https://www.xiaohongshu.com", e:"📕" },
        { n:"视频号", u:"https://channels.weixin.qq.com", e:"🎬" },
        { n:"豆瓣", u:"https://www.douban.com", e:"🫘" },
        { n:"懂车帝", u:"https://www.dongchedi.com", e:"🚗" },
      ]}
  ]},
  { section: "海外华人 / 台湾 OTT", emoji: "🌏", desc: "面向海外华人的影视与直播平台", subs: [
      { sub: "", items: [
        { n:"泥视频", u:"https://www.nivod.cc", e:"🎞️" },
        { n:"爱一凡", u:"https://www.iyf.tv", e:"🍿" },
        { n:"4gtv", u:"https://www.4gtv.tv", e:"🔉" },
        { n:"Ofiii", u:"https://www.ofiii.com", e:"📶" },
        { n:"MeWatch", u:"https://www.mewatch.sg", e:"🇸🇬" },
        { n:"FainTV", u:"https://www.faintv.com.tw", e:"📺" },
      ]}
  ]},
];

/* ============ 点击计数（localStorage） ============ */
const FREQ_KEY = "nav_freq_v1";
let freq = {};
try { freq = JSON.parse(localStorage.getItem(FREQ_KEY) || "{}"); } catch(e) {}
function saveFreq() { localStorage.setItem(FREQ_KEY, JSON.stringify(freq)); }
function getFreq(u) { return freq[u] || 0; }

/* ============ 构建 DOM ============ */
const app = document.getElementById("app");
const groupEls = []; // { el, name, grids: [{gridEl, cards: [{a, n, u, domain}]}] }
let total = 0;

data.forEach(group => {
  const count = group.subs.reduce((a,s)=>a+s.items.length,0);
  total += count;

  const frag = document.createDocumentFragment();
  const h2 = document.createElement("h2");
  h2.className = "section";
  h2.innerHTML = `<span class="emoji">${group.emoji}</span>${group.section} <span class="count">${count}</span>`;
  frag.appendChild(h2);

  if (group.desc) {
    const p = document.createElement("p");
    p.className = "section-desc";
    p.textContent = group.desc;
    frag.appendChild(p);
  }

  const grids = [];
  group.subs.forEach(s => {
    if (s.sub) {
      const h3 = document.createElement("h3");
      h3.className = "sub";
      h3.textContent = "▸ " + s.sub;
      frag.appendChild(h3);
    }
    const grid = document.createElement("div");
    grid.className = "grid";
    const cards = [];
    s.items.forEach(it => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = it.u;
      a.target = "_blank";
      a.rel = "noopener";
      const domain = it.u.replace(/^https?:\/\//, "").split("/")[0];
      a.innerHTML = `
        <span class="freq-badge">⭐</span>
        <div class="icon">
          <span class="emoji">${it.e}</span>
          <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64"
               onerror="this.remove()" alt="">
        </div>
        <div class="name">${it.n}</div>`;
      // 点击计数
      a.addEventListener("click", () => {
        freq[it.u] = getFreq(it.u) + 1;
        saveFreq();
        applyPin();
      });
      cards.push({ a, n: it.n, u: it.u, domain });
      grid.appendChild(a);
    });
    grids.push({ grid, cards, subName: s.sub || "" });
    frag.appendChild(grid);
  });

  const d = document.createElement("div");
  d.className = "divider";
  frag.appendChild(d);

  app.appendChild(frag);
  groupEls.push({ frag, name: group.section, grids });
});

document.getElementById("total").textContent = total;

/* ============ 常用置顶：组内按点击次数排序 + 星标 ============ */
const pinToggle = document.getElementById("pinToggle");
function applyPin() {
  if (!pinToggle.checked) {
    // 恢复原始顺序
    groupEls.forEach(g => {
      g.grids.forEach(gr => {
        gr.cards.sort((x, y) => gr.cards.indexOf(x) - gr.cards.indexOf(y)); // no-op
        gr.cards.forEach(c => { c.a.classList.remove("pinned"); gr.grid.appendChild(c.a); });
      });
    });
    return;
  }
  groupEls.forEach(g => {
    g.grids.forEach(gr => {
      gr.cards.sort((x, y) => getFreq(y.u) - getFreq(x.u));
      gr.cards.forEach(c => {
        c.a.classList.toggle("pinned", getFreq(c.u) > 0);
        gr.grid.appendChild(c.a);
      });
    });
  });
}
pinToggle.addEventListener("change", applyPin);

/* ============ 实时搜索过滤 ============ */
const searchInput = document.getElementById("search");
const emptyBox = document.getElementById("empty");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  let anyVisible = false;

  groupEls.forEach(g => {
    let groupVisible = false;
    g.grids.forEach(gr => {
      let gridVisible = false;
      gr.cards.forEach(c => {
        const hit = !q || c.n.toLowerCase().includes(q) || c.domain.includes(q);
        c.a.style.display = hit ? "" : "none";
        if (hit) { gridVisible = true; groupVisible = true; anyVisible = true; }
      });
      gr.grid.style.display = gridVisible ? "" : "none";
    });
    // 隐藏整组标题与描述
    const sectionEl = g.frag;
    // 用 closest 找到组内首个 h2（frag 已插入 app）
  });

  // 隐藏没有可见卡片的分区标题
  document.querySelectorAll("h2.section").forEach(h2 => {
    let el = h2.nextElementSibling, visible = false;
    while (el && !el.classList.contains("divider")) {
      if ((el.classList.contains("grid") && el.style.display !== "none")) visible = true;
      el = el.nextElementSibling;
    }
    h2.style.display = visible ? "" : "none";
    // 同时隐藏相邻的 desc / sub
    let e2 = h2.nextElementSibling;
    while (e2 && !e2.classList.contains("divider")) {
      if (e2.classList.contains("section-desc") || e2.classList.contains("sub"))
        e2.style.display = visible ? "" : "none";
      e2 = e2.nextElementSibling;
    }
  });

  emptyBox.style.display = anyVisible ? "none" : "block";
});
</script>
